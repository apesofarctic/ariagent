services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - LLM_API_KEY=ollama
      - LLM_MODEL=qwen2.5:3b
      - USE_LLM=true
    extra_hosts: ["host.docker.internal:host-gateway"]
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    depends_on: [backend]
